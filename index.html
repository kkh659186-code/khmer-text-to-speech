<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer Text to Speech</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        button:active {
            transform: translateY(0);
        }
        #speakBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #downloadBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            min-height: 40px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗣️ បម្លើសអត្ថបទ</h1>
        <p>បញ្ចូលអត្ថបទខ្មែរដើម្បីបម្លើសទៅជាសំឡេង</p>
        <textarea id="textInput" placeholder="សូមវាយអត្ថបទនៅទីនេះ..."></textarea>
        <div class="buttons">
            <button id="speakBtn">🔊 ស្តាប់សំឡេង</button>
            <button id="downloadBtn">📥 ទាញយក MP3</button>
        </div>
        <div id="status"></div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const speakBtn = document.getElementById('speakBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');

        let audioContext = null;
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type;
        }

        function getKhmerVoice() {
            const voices = speechSynthesis.getVoices();
            return voices.find(v => v.lang.includes('km')) || voices.find(v => v.lang.includes('th')) || voices[0];
        }

        async function loadVoices() {
            return new Promise((resolve) => {
                if (speechSynthesis.getVoices().length > 0) {
                    resolve();
                } else {
                    speechSynthesis.onvoiceschanged = () => resolve();
                }
            });
        }

        speakBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                showStatus('សូមបញ្ចូលអត្ថបទជាមុនសិន។', 'error');
                return;
            }

            showStatus('កំពុងដំណើរកការ...', 'info');
            await loadVoices();

            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = getKhmerVoice();
                if (voice) utterance.voice = voice;
                utterance.lang = 'km-KH';
                utterance.rate = 0.8;
                utterance.pitch = 1;

                utterance.onstart = () => {
                    showStatus('កំពុងអានអត្ថបទ...', 'info');
                };

                utterance.onend = () => {
                    showStatus('បានបញ្ចប់ការអាន។', 'success');
                };

                utterance.onerror = (e) => {
                    showStatus('មានបញ្ហាក្នុងការអាន៖ ' + e.error, 'error');
                };

                speechSynthesis.speak(utterance);
            } else {
                showStatus('Browser របស់អ្នកមិនគាំទ្រការបម្លើសទេ។', 'error');
            }
        });

        downloadBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                showStatus('សូមបញ្ចូលអត្ថបទជាមុនសិន។', 'error');
                return;
            }

            showStatus('កំពុងចាប់ផ្តើមថត...', 'info');
            await loadVoices();

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const url = URL.createObjectURL(audioBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'khmer-speech.mp3';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showStatus('បានទាញយក MP3 ដោយជោគជ័យ។', 'success');
                };

                mediaRecorder.start();

                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    const voice = getKhmerVoice();
                    if (voice) utterance.voice = voice;
                    utterance.lang = 'km-KH';
                    utterance.rate = 0.8;

                    utterance.onend = () => {
                        setTimeout(() => {
                            mediaRecorder.stop();
                            mediaStream.getTracks().forEach(track => track.stop());
                        }, 500);
                    };

                    speechSynthesis.speak(utterance);
                }
            } catch (e) {
                showStatus('មានបញ្ហាក្នុងការថតសំឡេង៖ ' + e.message, 'error');
            }
        });
    </script>
</body>
</html>
