<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech - បម្លើសអត្ថបទ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            resize: vertical;
            transition: all 0.3s;
            font-family: inherit;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #generateBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            justify-content: center;
        }
        #downloadBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        #resultBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            min-height: 50px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .info-text {
            margin-top: 25px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .info-text strong {
            color: #667eea;
        }
        .preview-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
        }
        .preview-box h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .preview-text {
            font-size: 15px;
            line-height: 1.5;
            color: #333;
        }
        .speaking {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: loading 1s ease-in-out infinite;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗣️ បម្លើសអត្ថបទ</h1>
        <p class="subtitle">Text to Speech - Auto Language Detection</p>
        
        <textarea id="textInput" placeholder="វាយអត្ថបទខ្មែរ ឬ English នៅទីនេះ...">សួស្តី! តើអ្នកសុខសប្បាយជា?</textarea>
        
        <div class="buttons">
            <button id="generateBtn">⚡ បង្កើតសំឡេង</button>
            <button id="resultBtn">🔊 បង្ហាញលទ្ធផល</button>
            <button id="downloadBtn">📥 ទាញយក MP3</button>
        </div>

        <div id="status" class="status"></div>

        <div id="previewBox" class="preview-box" style="display:none;">
            <h3>📝 សង្កេតមើលអត្ថបទ</h3>
            <div id="previewText" class="preview-text"></div>
        </div>

        <div class="info-text">
            <strong>របៀបប្រើ:</strong> វាយអត្ថបទ → ចុច "បង្កើតសំឡេង" → បង្ហាញលទ្ធផល ឬទាញយក MP3
            <br><br>
            <strong>លក្ខណៈ:</strong> ប្រើប្រាស់ Browser API - ប្រកែងភាសាដោយស្វ័យប្រវត្តិ
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultBtn = document.getElementById('resultBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const previewBox = document.getElementById('previewBox');
        const previewText = document.getElementById('previewText');

        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let currentSpeaking = false;

        const messages = {
            km: {
                empty: 'សូមបញ្ចូលអត្ថបទជាមុនសិន។',
                processing: 'កំពុងបង្កើតសំឡេង...',
                detecting: 'កំពុងដក់កានភាសា...',
                reading: 'កំពុងអានអត្ថបទ...',
                done: 'បានបញ្ចប់ការអាន។',
                error: 'មានបញ្ហាក្នុងការអាន៖ ',
                browser: 'Browser របស់អ្នកមិនគាំទ្រការបម្លើសទេ។',
                recording: 'កំពុងចាប់ផ្តើមថត...',
                downloading: 'បានទាញយក MP3 ដោយជោគជ័យ។',
                recordError: 'មានបញ្ហាក្នុងការថតសំឡេង៖ ',
                speak: 'ស្តាប់ប់សំឡេង',
                generate: 'បង្កើតសំឡេង',
                result: 'បង្ហាញលទ្ធផល'
            },
            en: {
                empty: 'Please enter text first.',
                processing: 'Generating speech...',
                detecting: 'Detecting language...',
                reading: 'Reading text...',
                done: 'Reading completed.',
                error: 'Error reading text: ',
                browser: 'Your browser does not support text to speech.',
                recording: 'Starting recording...',
                downloading: 'Successfully downloaded MP3.',
                recordError: 'Error recording audio: ',
                speak: 'Play Speech',
                generate: 'Generate Speech',
                result: 'Show Result'
            }
        };

        function detectLanguage(text) {
            const khmerChars = /[\u1780-\u17FF]/;
            return khmerChars.test(text) ? 'km' : 'en';
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status show ${type}`;
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 3000);
        }

        function getVoice(lang) {
            const voices = speechSynthesis.getVoices();
            return voices.find(v => v.lang.includes(lang === 'km' ? 'km' : 'en')) || 
                   voices.find(v => v.lang.includes(lang === 'km' ? 'th' : 'en')) || 
                   voices[0];
        }

        function loadVoices() {
            return new Promise((resolve) => {
                if (speechSynthesis.getVoices().length > 0) {
                    resolve();
                } else {
                    speechSynthesis.onvoiceschanged = () => resolve();
                }
            });
        }

        async function speakText(text, lang) {
            return new Promise((resolve, reject) => {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = getVoice(lang);
                if (voice) utterance.voice = voice;
                utterance.lang = lang === 'km' ? 'km-KH' : 'en-US';
                utterance.rate = lang === 'km' ? 0.8 : 1.0;

                utterance.onstart = () => {
                    currentSpeaking = true;
                    generateBtn.classList.add('speaking');
                };

                utterance.onend = () => {
                    currentSpeaking = false;
                    generateBtn.classList.remove('speaking');
                    resolve();
                };

                utterance.onerror = (e) => {
                    currentSpeaking = false;
                    generateBtn.classList.remove('speaking');
                    reject(e);
                };

                speechSynthesis.speak(utterance);
            });
        }

        function getTextToRead(text, lang) {
            if (lang === 'km') {
                return text + ' សួស្តី! អត្ថបទនេះជាភាសាខ្មែរ។';
            }
            return text + ' Hello! This text is in English.';
        }

        generateBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                showStatus(messages.km.empty, 'error');
                return;
            }

            showStatus(messages.km.processing, 'info');
            await loadVoices();

            const lang = detectLanguage(text);
            const textToRead = getTextToRead(text, lang);

            try {
                speechSynthesis.cancel();
                await speakText(textToRead, lang);
                showStatus(lang === 'km' ? 'បង្កើតសំឡេងជោគជ័យ!' : 'Speech generated successfully!', 'success');
            } catch (e) {
                showStatus(messages.km.browser, 'error');
            }
        });

        resultBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                showStatus(messages.km.empty, 'error');
                return;
            }

            previewText.textContent = text;
            previewBox.style.display = 'block';
            showStatus('បង្ហាញលទ្ធផលហើយ!', 'success');
        });

        downloadBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                showStatus(messages.km.empty, 'error');
                return;
            }

            showStatus(messages.km.recording, 'info');
            await loadVoices();

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const url = URL.createObjectURL(audioBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `speech-${detectLanguage(text)}-${Date.now()}.mp3`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showStatus(messages.km.downloading, 'success');
                };

                mediaRecorder.start();

                const lang = detectLanguage(text);
                const textToRead = getTextToRead(text, lang);
                await speakText(textToRead, lang);

                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                    }
                }, 500);
            } catch (e) {
                showStatus(messages.km.recordError + e.message, 'error');
            }
        });
    </script>
</body>
</html>
