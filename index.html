<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech - បម្លើសអត្ថបទ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .language-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .lang-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .lang-btn:hover:not(.active) {
            border-color: #667eea;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            resize: vertical;
            transition: all 0.3s;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .placeholder-text {
            color: #999;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #speakBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #downloadBtn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            min-height: 50px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .info-text {
            margin-top: 30px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .info-text strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗣️ បម្លើសអត្ថបទ</h1>
        <p class="subtitle">Text to Speech | បម្លើសអត្ថបទទៅជាសំឡេង</p>
        
        <div class="language-selector">
            <button class="lang-btn active" data-lang="km">🇨🇳 ខ្មែរ</button>
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
        </div>

        <textarea id="textInput" class="placeholder-text">សូមវាយអត្ថបទនៅទីនេះ...</textarea>
        
        <div class="buttons">
            <button id="speakBtn">🔊 ស្តាប់</button>
            <button id="downloadBtn">📥 ទាញយក MP3</button>
        </div>

        <div id="status" class="status"></div>

        <div class="info-text">
            <strong>ប្រើប្រាស៖</strong> Select language បញ្ចូលអត្ថបទ ចុចស្តាប់សំឡេង ឬទាញយក MP3
            <br><br>
            <strong>Support:</strong> Khmer & English | Works on Chrome, Edge, Safari
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const speakBtn = document.getElementById('speakBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const langButtons = document.querySelectorAll('.lang-btn');

        let currentLang = 'km';
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];

        const placeholders = {
            km: 'សូមវាយអត្ថបទនៅទីនេះ...',
            en: 'Type your text here...'
        };

        const messages = {
            km: {
                empty: 'សូមបញ្ចូលអត្ថបទជាមុនសិន។',
                processing: 'កំពុងដំណើរការ...',
                reading: 'កំពុងអានអត្ថបទ...',
                done: 'បានបញ្ចប់ការអាន។',
                error: 'មានបញ្ហាក្នុងការអាន៖ ',
                browser: 'Browser របស់អ្នកមិនគាំទ្រការបម្លើសទេ។',
                recording: 'កំពុងចាប់ផ្តើមថត...',
                downloading: 'បានទាញយក MP3 ដោយជោគជ័យ។',
                recordError: 'មានបញ្ហាក្នុងការថតសំឡេង៖ '
            },
            en: {
                empty: 'Please enter text first.',
                processing: 'Processing...',
                reading: 'Reading text...',
                done: 'Reading completed.',
                error: 'Error reading text: ',
                browser: 'Your browser does not support text to speech.',
                recording: 'Starting recording...',
                downloading: 'Successfully downloaded MP3.',
                recordError: 'Error recording audio: '
            }
        };

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status show ${type}`;
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 3000);
        }

        function setLanguage(lang) {
            currentLang = lang;
            textInput.placeholder = placeholders[lang];
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        function getVoice(lang) {
            const voices = speechSynthesis.getVoices();
            const langCode = lang === 'km' ? 'km' : 'en';
            return voices.find(v => v.lang.includes(langCode)) || voices.find(v => v.lang.includes(lang === 'km' ? 'th' : 'en')) || voices[0];
        }

        function loadVoices() {
            return new Promise((resolve) => {
                if (speechSynthesis.getVoices().length > 0) {
                    resolve();
                } else {
                    speechSynthesis.onvoiceschanged = () => resolve();
                }
            });
        }

        function speakText(text) {
            return new Promise((resolve, reject) => {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = getVoice(currentLang);
                if (voice) utterance.voice = voice;
                utterance.lang = currentLang === 'km' ? 'km-KH' : 'en-US';
                utterance.rate = currentLang === 'km' ? 0.8 : 1.0;

                utterance.onstart = () => {
                    showStatus(messages[currentLang].reading, 'info');
                };

                utterance.onend = () => {
                    showStatus(messages[currentLang].done, 'success');
                    resolve();
                };

                utterance.onerror = (e) => {
                    showStatus(messages[currentLang].error + e.error, 'error');
                    reject(e);
                };

                speechSynthesis.speak(utterance);
            });
        }

        langButtons.forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        speakBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                showStatus(messages[currentLang].empty, 'error');
                return;
            }

            showStatus(messages[currentLang].processing, 'info');
            await loadVoices();

            try {
                speechSynthesis.cancel();
                await speakText(text);
            } catch (e) {
                showStatus(messages[currentLang].browser, 'error');
            }
        });

        downloadBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                showStatus(messages[currentLang].empty, 'error');
                return;
            }

            showStatus(messages[currentLang].recording, 'info');
            await loadVoices();

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const url = URL.createObjectURL(audioBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `speech-${currentLang}-${Date.now()}.mp3`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showStatus(messages[currentLang].downloading, 'success');
                };

                mediaRecorder.start();

                await speakText(text);

                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                    }
                }, 500);
            } catch (e) {
                showStatus(messages[currentLang].recordError + e.message, 'error');
            }
        });
    </script>
</body>
</html>
